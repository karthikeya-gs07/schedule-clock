[versions]
androidGradlePlugin = "9.4.1"
wearComplications = "1.3.0"
playServicesWearable = "19.0.0"
work = "2.10.0"
watchFacePush = "1.0.0"
faceValidator = "1.1.0-alpha01"
coroutines = "1.9.0"
kotlin = "2.2.10"          # the Kotlin built into AGP; the Compose compiler plugin must match it
composeBom = "2026.06.01"   # Compose 1.11: the newest that builds against SDK 36 (1.12 needs SDK 37)
activityCompose = "1.13.0"
lifecycle = "2.10.0"
webkit = "1.18.0"
remoteInteractions = "1.2.0"
haze = "1.6.10"            # frosted-glass blur; 1.7+ needs Compose 1.12

[libraries]
wear-complications-data-source-ktx = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "wearComplications" }

play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
wear-watchfacepush = { module = "androidx.wear.watchfacepush:watchfacepush", version.ref = "watchFacePush" }
face-validator-cli = { module = "com.google.android.wearable.watchface.validator:validator-push-cli", version.ref = "faceValidator" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutines" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
wear-remote-interactions = { module = "androidx.wear:wear-remote-interactions", version.ref = "remoteInteractions" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
